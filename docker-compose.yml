services:
  database:
    build:
      context: ./prison-database (Database)
    image: prison-database
    container_name: prison-database
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  backend:
    build:
      context: ./prison-server (Backend)
    image: prison-backend
    container_name: prison-backend
    ports:
      - "5000:5000"
    env_file:
      - ./prison-server (Backend)/.env
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://database:27017/prison_db
    depends_on:
      - database
    restart: unless-stopped

  frontend:
    build:
      context: ./prison-client (Frontend)
    image: prison-frontend
    container_name: prison-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo_data:
